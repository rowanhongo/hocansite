  <script type="module">
  import { getPublicSuccessStories } from './js/supabase.js';

  function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  let allStories = [];
  let lastFocused = null;

  // ── Description rendering ──────────────────────────────────────────────
  // Descriptions are authored as HTML in the admin. Older ones are plain text,
  // so those get converted: blank lines become paragraphs, *text* becomes bold.
  const ALLOWED = {P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,H3:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,A:1};

  function sanitizeHtml(html) {
    const holder = document.createElement('div');
    holder.innerHTML = html;
    holder.querySelectorAll('script,style,iframe,object,embed').forEach(n => n.remove());
    holder.querySelectorAll('*').forEach(node => {
      if (!ALLOWED[node.tagName]) {
        while (node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
        node.remove();
        return;
      }
      [...node.attributes].forEach(attr => {
        const keepLink = node.tagName === 'A' && attr.name === 'href' && /^(https?:|mailto:|\/)/i.test(attr.value.trim());
        if (!keepLink) node.removeAttribute(attr.name);
      });
      if (node.tagName === 'A') { node.setAttribute('rel','noopener noreferrer'); node.setAttribute('target','_blank'); }
    });
    return holder.innerHTML;
  }

  function looksLikeHtml(s) { return /<(p|h3|ul|ol|li|br|b|strong|i|em|blockquote)\b/i.test(s || ''); }

  // Bold a *marked* run. Applied per line, so the run may not span a newline.
  // The markers must hug their content, so "3 * 4 * 5" stays as multiplication.
  function markupInline(escaped) {
    return escaped.replace(/\*(\S[^*\n]*?)\*/g, '<strong>$1</strong>');
  }

  function plainTextToHtml(text) {
    const src = String(text || '').replace(/\r\n?/g, '\n');
    // Prefer blank lines as the paragraph separator. When the author never used
    // one (common when text is pasted), fall back to single newlines so the
    // result is still paragraphs rather than one fused block.
    const blocks = /\n\s*\n/.test(src) ? src.split(/\n\s*\n+/) : src.split(/\n/);

    return blocks
      .map(b => b.trim())
      .filter(Boolean)
      .map(block => {
        const plain = block.replace(/\*/g, '').trim();
        // A short standalone line with no closing punctuation reads as a heading.
        if (!block.includes('\n') && plain.length < 70 && !/[.:,;!?]$/.test(plain) && !/^[•\-–—✔✅]/.test(plain)) {
          return `<h3>${esc(plain)}</h3>`;
        }
        const html = block.split('\n').map(line => markupInline(esc(line))).join('<br>');
        return `<p>${html}</p>`;
      }).join('');
  }

  // Convert *marked* runs inside already-HTML descriptions.
  //
  // A run can straddle element boundaries — the editor turns "*Cafe Wadani*" into
  // "*Cafe <strong>Wadani</strong>*", putting the two asterisks in different text
  // nodes. Matching per node therefore misses the pair and leaves both visible.
  // Instead, collect the block's text nodes, pair the asterisks across that whole
  // sequence, and delete the two marker characters wherever they landed. Text
  // already inside a bold tag keeps its emphasis, so only the markers disappear.
  function boldAsterisksInHtml(html) {
    const holder = document.createElement('div');
    holder.innerHTML = html;

    // Group every text node by the block it belongs to, so a run is only paired
    // within one paragraph — never bridging from one paragraph into the next.
    const BLOCK = 'p,h3,li,blockquote';
    const groups = new Map();
    const walker = document.createTreeWalker(holder, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      const owner = n.parentElement.closest(BLOCK) || holder;
      if (!groups.has(owner)) groups.set(owner, []);
      groups.get(owner).push(n);
    }
    groups.forEach(nodes => stripMarkersIn(nodes));
    return holder.innerHTML;

    function stripMarkersIn(nodes) {
      // Flatten the block so a marker can be judged by its true neighbours, even
      // when the adjacent character lives in a different text node.
      const flat = nodes.map(n => n.nodeValue).join('');
      const offset = [];
      let run = 0;
      nodes.forEach((n, i) => { offset[i] = run; run += n.nodeValue.length; });

      // An opener must be followed by content, a closer preceded by it — the
      // Markdown rule. It keeps "3 * 4 * 5" (spaces both sides) as literal
      // multiplication instead of silently eating the numbers.
      const marks = [];
      nodes.forEach((node, i) => {
        const text = node.nodeValue;
        for (let c = 0; c < text.length; c++) {
          if (text[c] !== '*') continue;
          const at = offset[i] + c;
          const prev = flat[at - 1] || '';
          const next = flat[at + 1] || '';
          const canOpen = next && !/\s/.test(next);
          const canClose = prev && !/\s/.test(prev);
          if (canOpen || canClose) marks.push({ i, c, canOpen, canClose });
        }
      });
      if (marks.length < 2) return;

      // Pair each opener with the next valid closer; unmatched markers stay put.
      const doomed = [];
      for (let a = 0; a < marks.length; a++) {
        if (!marks[a].canOpen) continue;
        for (let b = a + 1; b < marks.length; b++) {
          if (!marks[b].canClose) continue;
          doomed.push(marks[a], marks[b]);
          a = b;
          break;
        }
      }
      if (!doomed.length) return;

      // Wrap the spanned text in <strong> only when the run sits in one node and
      // isn't already emphasised; otherwise just drop the marker characters.
      for (let k = doomed.length - 2; k >= 0; k -= 2) {
        const open = doomed[k], close = doomed[k + 1];
        const node = nodes[open.i];
        if (open.i === close.i && !node.parentElement.closest('b,strong')) {
          const t = node.nodeValue;
          const inner = t.slice(open.c + 1, close.c);
          if (!inner.trim()) continue;
          const after = node.splitText(close.c + 1);
          const mid = node.splitText(open.c);
          const strong = document.createElement('strong');
          strong.textContent = inner;
          mid.parentNode.replaceChild(strong, mid);
          void after;
        } else {
          // Split run: remove the later marker first so earlier offsets hold.
          const cNode = nodes[close.i], oNode = nodes[open.i];
          cNode.nodeValue = cNode.nodeValue.slice(0, close.c) + cNode.nodeValue.slice(close.c + 1);
          oNode.nodeValue = oNode.nodeValue.slice(0, open.c) + oNode.nodeValue.slice(open.c + 1);
        }
      }
    }
  }

  function descriptionHtml(desc) {
    if (!looksLikeHtml(desc)) return plainTextToHtml(desc);
    const clean = sanitizeHtml(desc);
    return clean.includes('*') ? boldAsterisksInHtml(clean) : clean;
  }

  // Split the description into a lead-in and the body that follows.
  //
  // The card previously flattened every block into one string, which is why it
  // read as a run-on: a heading and the sentence after it are different things
  // and need to look different, not be glued together with a space. So keep the
  // structure the description already has — the <h3> (or an ALL-CAPS opening
  // line) becomes the card's kicker, everything after it becomes the summary.
  function cardText(desc) {
    const holder = document.createElement('div');
    holder.innerHTML = descriptionHtml(desc);

    const blocks = [...holder.children].filter(el => (el.textContent || '').trim());
    if (!blocks.length) return { kicker: '', summary: clamp(flatten(holder), 165) };

    const first = blocks[0];
    const firstText = tidy(first.textContent);
    // A heading, or a short all-caps opener like "RESULTS SPEAK LOUDER THAN
    // PROMISES", is a label for what follows rather than part of the prose.
    const isKicker = first.tagName === 'H3' ||
      (firstText.length <= 60 && firstText === firstText.toUpperCase() && /[A-Z]/.test(firstText));

    if (!isKicker) return { kicker: '', summary: clamp(flatten(holder), 165) };

    const rest = document.createElement('div');
    blocks.slice(1).forEach(el => rest.appendChild(el.cloneNode(true)));
    return { kicker: firstText, summary: clamp(flatten(rest), 150) };
  }

  // Join blocks so words from adjacent blocks or <br> lines never fuse.
  // Sentences already ending in punctuation just get a space; anything else gets
  // a middot, which separates list-ish fragments without looking like a dash.
  function flatten(root) {
    const clone = root.cloneNode(true);
    clone.querySelectorAll('br').forEach(br => br.replaceWith(document.createTextNode('\n')));

    const parts = [];
    const walk = clone.children.length ? [...clone.children] : [clone];
    walk.forEach(el => {
      (el.textContent || '').split('\n').forEach(line => {
        const t = tidy(line);
        if (t) parts.push(t);
      });
    });

    return parts.reduce((acc, part) => {
      if (!acc) return part;
      return acc + (/[.!?]$/.test(acc) ? ' ' : ' · ') + part;
    }, '');
  }

  function tidy(s) {
    return String(s || '')
      .replace(/\s+/g, ' ')
      .replace(/\s+([.,;:!?])/g, '$1')
      .replace(/^[•\-–—✔✅]\s*/, '')
      .trim();
  }

  function clamp(text, max) {
    if (text.length <= max) return text;
    const cut = text.slice(0, max);
    const at = cut.lastIndexOf(' ');
    return (at > max * 0.5 ? cut.slice(0, at) : cut).replace(/[\s.,;:!?•·\-–—✔✅]+$/, '') + '…';
  }

  function buildCarousel(images, id) {
    if (!images || images.length === 0) return '';
    const slides = images.map((u, i) =>
      `<div class="carousel-slide"><img src="${esc(u)}" alt="Project image ${i+1}" loading="${i === 0 ? 'eager' : 'lazy'}"></div>`
    ).join('');
    if (images.length === 1) {
      return `<div class="carousel"><div class="carousel-viewport"><div class="carousel-track">${slides}</div></div></div>`;
    }
    const dots = images.map((_, i) => `<button class="carousel-dot${i===0?' active':''}" data-slide="${i}" aria-label="Go to image ${i+1}"></button>`).join('');
    return `<div class="carousel" data-carousel-id="${id}">
      <div class="carousel-viewport"><div class="carousel-track">${slides}</div></div>
      <span class="carousel-count"><span class="carousel-current">1</span> / ${images.length}</span>
      <button class="carousel-btn prev" data-dir="-1" aria-label="Previous image">‹</button>
      <button class="carousel-btn next" data-dir="1" aria-label="Next image">›</button>
      <div class="carousel-dots">${dots}</div>
    </div>`;
  }

  // The card is a compact teaser: one thumbnail + title + excerpt.
  // The full video and carousel live in the detail view, at the top.
  function renderStoryCard(story, index) {
    const images = Array.isArray(story.images) ? story.images : [];
    const hasVideo = !!story.video_url;
    const { kicker, summary } = cardText(story.description);
    const thumb = images[0];
    let thumbHtml = '';
    if (thumb) {
      const badge = hasVideo ? '<span class="badge-media">▶ Video</span>'
        : images.length > 1 ? `<span class="badge-media">🖼 ${images.length} photos</span>` : '';
      thumbHtml = `<div class="story-thumb"><img src="${esc(thumb)}" alt="${esc(story.title)}" loading="lazy">${badge}</div>`;
    } else if (hasVideo) {
      thumbHtml = `<div class="story-thumb"><video src="${esc(story.video_url)}#t=0.5" preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover;"></video><span class="badge-media">▶ Video</span></div>`;
    }
    return `<article class="story glass${thumbHtml ? '' : ' no-media'}" data-story-index="${index}" tabindex="0" role="button" aria-label="Read the ${esc(story.title)} story">
      ${thumbHtml}
      <div class="story-body">
        <h2>${esc(story.title)}</h2>
        ${kicker ? `<p class="story-kicker">${esc(kicker)}</p>` : ''}
        <p class="story-excerpt">${esc(summary)}</p>
        <span class="story-more">Read the full story <span>→</span></span>
      </div>
    </article>`;
  }

  function openDetail(story) {
    const overlay = document.getElementById('detailOverlay');
    lastFocused = document.activeElement;
    document.getElementById('detailTitle').textContent = story.title || '';
    const body = document.getElementById('detailBody');

    const images = Array.isArray(story.images) ? story.images : [];
    let media = '';
    if (story.video_url) {
      media += `<video src="${esc(story.video_url)}" controls preload="metadata"></video>`;
    }
    if (images.length) {
      media += buildCarousel(images, 'detail');
    }

    body.innerHTML =
      (media ? `<div class="story-detail-media">${media}</div>` : '') +
      `<div class="story-detail-body"><div class="story-prose">${descriptionHtml(story.description)}</div></div>`;

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    initCarousels(body);
    document.getElementById('detailClose').focus();
  }

  function closeDetail() {
    const overlay = document.getElementById('detailOverlay');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    overlay.querySelectorAll('video').forEach(v => v.pause());
    document.getElementById('detailBody').innerHTML = '';
    if (lastFocused) lastFocused.focus();
  }

  function initCarousels(container) {
    container.querySelectorAll('.carousel').forEach(carousel => {
      const track = carousel.querySelector('.carousel-track');
      const slides = track.querySelectorAll('.carousel-slide');
      if (slides.length <= 1) return;
      const counter = carousel.querySelector('.carousel-current');
      let current = 0;

      function goTo(idx) {
        current = ((idx % slides.length) + slides.length) % slides.length;
        track.style.transform = `translateX(-${current * 100}%)`;
        carousel.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === current));
        if (counter) counter.textContent = current + 1;
      }

      carousel.querySelectorAll('.carousel-btn').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); goTo(current + parseInt(btn.dataset.dir)); });
      });
      carousel.querySelectorAll('.carousel-dot').forEach(dot => {
        dot.addEventListener('click', e => { e.stopPropagation(); goTo(parseInt(dot.dataset.slide)); });
      });

      // Swipe on touch devices.
      let startX = null;
      carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      carousel.addEventListener('touchend', e => {
        if (startX === null) return;
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 45) goTo(current + (dx < 0 ? 1 : -1));
        startX = null;
      }, { passive: true });
    });
  }

  async function load() {
    const container = document.getElementById('storiesList');
    try {
      allStories = await getPublicSuccessStories();
      if (!allStories.length) {
        container.innerHTML = '<div class="empty glass"><p>No success stories published yet. Check back soon!</p></div>';
        return;
      }
      container.innerHTML = allStories.map((s, i) => renderStoryCard(s, i)).join('');

      container.addEventListener('click', e => {
        const card = e.target.closest('[data-story-index]');
        if (!card) return;
        const idx = parseInt(card.dataset.storyIndex);
        if (allStories[idx]) openDetail(allStories[idx]);
      });
      container.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const card = e.target.closest('[data-story-index]');
        if (!card) return;
        e.preventDefault();
        const idx = parseInt(card.dataset.storyIndex);
        if (allStories[idx]) openDetail(allStories[idx]);
      });
    } catch (err) {
      container.innerHTML = `<div class="empty glass"><p>Could not load stories. Please try again later.</p></div>`;
    }
  }

  document.getElementById('detailClose').addEventListener('click', closeDetail);
  document.getElementById('detailOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('detailOverlay')) closeDetail();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('detailOverlay').classList.contains('open')) closeDetail();
  });

  load();
</script>
  <script src="assets/nav.js" defer></script>
</body>
