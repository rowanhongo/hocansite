[build]
functions = "netlify/functions"
# Without this, the prerender below never runs: /blog/<slug> falls through to the
# bare blog-post.html shell, whose <title> and OG tags are generic — so shared
# links preview as "Blog Post — Hocan Holdings" instead of the article. The
# script degrades to a no-op (exit 0) when SUPABASE_* env vars are unset.
command = "npm run build"

# Pre-rendered posts are written by scripts/prerender-blogs.js to /blog/<slug>/index.html,
# so /blog/<slug> resolves to that real file without relying on the Pretty URLs setting.
# Static files take precedence over this non-forced rule, which is the fallback for
# posts published since the last build (rendered client-side).
[[redirects]]
from = "/blog/*"
to = "/blog-post.html"
status = 200

[[redirects]]
from = "/blog"
to = "/blogs.html"
status = 301
force = true

[[redirects]]
from = "/jobs/*"
to = "/job-detail.html"
status = 200

# ---- Link hub ----------------------------------------------------------------
# The link-in-bio page is served from links.hocanholdings.co.ke, which is added
# as a domain alias on this same site. This rule rewrites that host's root to
# links.html; without it the subdomain would serve the main site's index.
# Netlify matches these host-scoped rules before the path-only rules below.
[[redirects]]
from = "https://links.hocanholdings.co.ke/"
to = "/links.html"
status = 200
force = true

# Same page on the main domain, so /links keeps working as a fallback and the
# admin's "Open the live page" button resolves in local dev too.
[[redirects]]
from = "/links"
to = "/links.html"
status = 200

# ---- Caching -----------------------------------------------------------------
# HTML must revalidate so edits go live immediately; the assets it references are
# content-addressed by path and safe to cache hard. must-revalidate means the
# browser asks "changed?" and gets a cheap 304 when it hasn't.

[[headers]]
for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# Optimised images are immutable: a new version gets a new filename.
[[headers]]
for = "/assets/opt/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Shared CSS/JS change in place, so a shorter window plus revalidation.
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
for = "/js/*"
  [headers.values]
  Cache-Control = "public, max-age=86400, must-revalidate"

# Runtime config is per-deploy and must never be cached by the browser.
[[headers]]
for = "/.netlify/functions/get-config"
  [headers.values]
  Cache-Control = "no-store"